name: Chat-only mode
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'app/lib/app.dart'
      - 'app/lib/main.dart'
      - 'app/lib/core/feature_flags.dart'
      - '.github/workflows/chat-only-mode.yml'
permissions:
  contents: read
jobs:
  reversible-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend/app backend/tools/test_chat_only_mode.py
      - run: python -m unittest discover -s backend/tools -p test_chat_only_mode.py -v
  android-debug:
    needs: reversible-mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --debug --target-platform android-arm64 --dart-define=LIFE_TRACKING_ENABLED=false
        working-directory: app
      - name: Prepare Android debugging tools
        run: curl --fail --location --retry 3 https://dl.google.com/android/repository/platform-tools-latest-windows.zip --output platform-tools-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lifehub-ai-chat-test-kit
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            platform-tools-windows.zip
          if-no-files-found: error
          retention-days: 7
